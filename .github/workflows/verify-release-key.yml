name: verify release signing key

on:
  push:
    branches:
      - "vaishnav/f/agent-first-cli-release"
    paths:
      - ".github/workflows/verify-release-key.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    environment: cli-release
    steps:
      - name: Validate Ed25519 signing seed
        env:
          KADO_RELEASE_SIGNING_KEY: ${{ secrets.KADO_RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os

          encoded = os.environ.get("KADO_RELEASE_SIGNING_KEY", "").strip()
          try:
              seed = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit("KADO_RELEASE_SIGNING_KEY is not valid base64")
          if len(seed) != 32:
              raise SystemExit("KADO_RELEASE_SIGNING_KEY must decode to exactly 32 bytes")
          print("release signing key format is valid")
          PY
