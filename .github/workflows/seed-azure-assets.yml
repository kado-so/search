name: seed Azure release assets

on:
  push:
    tags:
      - "azure-seed-v0.1.0"

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    runs-on: depot-ubuntu-24.04
    environment: cli-release
    env:
      GH_TOKEN: ${{ github.token }}
      KADO_RELEASE_VERSION: "0.1.0"
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_RELEASE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Download signed v0.1.0 release
        run: gh release download v0.1.0 --dir release
      - name: Upload, verify, and promote v0.1.0
        run: |
          ./scripts/publish-azure-assets.sh upload release
          ./scripts/publish-azure-assets.sh promote release
