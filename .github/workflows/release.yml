name: release CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: cli-production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: depot-ubuntu-24.04
    environment: cli-release
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      commit: ${{ steps.inputs.outputs.commit }}
      epoch: ${{ steps.inputs.outputs.epoch }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          commit="$(git rev-parse "$tag^{commit}")"
          printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'
          git fetch origin main
          git merge-base --is-ancestor "$commit" origin/main
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists" >&2
            exit 1
          fi
          epoch="$(git show -s --format=%ct "$commit")"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "epoch=$epoch" >>"$GITHUB_OUTPUT"
      - id: toolchain
        run: |
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - name: Export signed release build metadata
        env:
          KADO_RELEASE_SIGNING_KEY: ${{ secrets.KADO_RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.inputs.outputs.version }}
          COMMIT: ${{ steps.inputs.outputs.commit }}
          EPOCH: ${{ steps.inputs.outputs.epoch }}
        run: |
          go run ./tools/release \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --source-date-epoch "$EPOCH" \
            --write-goreleaser-env "$GITHUB_ENV"
      - name: Build all release targets with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: build --clean
      - name: Finalize signed release
        env:
          KADO_RELEASE_SIGNING_KEY: ${{ secrets.KADO_RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.inputs.outputs.version }}
          COMMIT: ${{ steps.inputs.outputs.commit }}
          EPOCH: ${{ steps.inputs.outputs.epoch }}
        run: |
          go run ./tools/release \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --source-date-epoch "$EPOCH" \
            --prebuilt dist/goreleaser \
            --out dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: kado-${{ steps.inputs.outputs.version }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  native-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: depot-ubuntu-24.04
            archive: kado_${{ needs.build.outputs.version }}_linux_amd64.tar.gz
            binary: kado
          - runner: depot-windows-2025
            archive: kado_${{ needs.build.outputs.version }}_windows_amd64.zip
            binary: kado.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kado-${{ needs.build.outputs.version }}
          path: release
      - name: Smoke test Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir extracted
          tar -xzf "release/$ARCHIVE" -C extracted
          test "$(./extracted/$BINARY version --json | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')" = "$VERSION"
          ./extracted/$BINARY release verify --directory "$PWD/release"
      - name: Smoke test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ParseTokens = $null
          $ParseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "release/install.ps1"),
            [ref]$ParseTokens,
            [ref]$ParseErrors
          )
          if ($ParseErrors.Count -ne 0) { throw "install.ps1 does not parse" }
          Expand-Archive -LiteralPath "release/$env:ARCHIVE" -DestinationPath extracted
          $identity = & "extracted/$env:BINARY" version --json | ConvertFrom-Json
          if ($identity.version -ne $env:VERSION) { throw "version mismatch" }
          & "extracted/$env:BINARY" release verify --directory "$PWD/release"
          if ($LASTEXITCODE -ne 0) { throw "release verification failed" }

  publish:
    needs: [build, native-smoke]
    runs-on: depot-ubuntu-24.04
    environment: cli-release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kado-${{ needs.build.outputs.version }}
          path: release
      - name: Publish GitHub Release
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "Kado CLI $VERSION" \
            --generate-notes
