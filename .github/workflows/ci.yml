name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    env:
      KADO_RELEASE_VERSION: 0.0.0-ci
      KADO_RELEASE_COMMIT: ${{ github.sha }}
      KADO_RELEASE_DATE: "1980-01-01T00:00:00Z"
      KADO_RELEASE_PUBLIC_KEY: ""
      KADO_RELEASE_KEY_ID: ci
      KADO_RELEASE_METADATA_URL: https://kado.so/install/releases/stable/release-metadata.json
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        shell: bash
        run: |
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)"
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting and generated files
        run: |
          test -z "$(gofmt -l .)"
          git diff --exit-code
      - name: Build all release targets with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: build --clean --snapshot

  native-lifecycle:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            race: true
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            race: true
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            race: true
          - runner: macos-15
            goos: darwin
            goarch: arm64
            race: true
          - runner: windows-2025
            goos: windows
            goarch: amd64
            race: true
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            race: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        shell: bash
        run: |
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)"
          test -n "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - name: Verify native target
        shell: bash
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          test "$(go env GOOS)" = "$EXPECTED_GOOS"
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
      - name: Test A2A lifecycle
        run: go test ./internal/a2adispatch ./internal/launcher ./cmd/kado -count=1 -timeout=15m
      - name: Test Windows Job Object
        if: runner.os == 'Windows'
        run: go test ./internal/processtree -count=1
      - name: Race-test A2A lifecycle
        if: matrix.race
        run: go test -race ./internal/a2adispatch ./internal/launcher ./cmd/kado -count=1 -timeout=20m
