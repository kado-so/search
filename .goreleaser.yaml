version: 2

project_name: kado

dist: dist/goreleaser

builds:
  - id: kado
    main: ./cmd/kado
    binary: kado_{{ .Env.KADO_RELEASE_VERSION }}_{{ .Os }}_{{ .Arch }}
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
      - -X github.com/kado-so/search/internal/buildinfo.Version={{ .Env.KADO_RELEASE_VERSION }}
      - -X github.com/kado-so/search/internal/buildinfo.Commit={{ .Env.KADO_RELEASE_COMMIT }}
      - -X github.com/kado-so/search/internal/buildinfo.Date={{ .Env.KADO_RELEASE_DATE }}
      - -X github.com/kado-so/search/internal/buildinfo.Target={{ .Os }}/{{ .Arch }}
      - -X github.com/kado-so/search/internal/buildinfo.ReleasePublicKey={{ .Env.KADO_RELEASE_PUBLIC_KEY }}
      - -X github.com/kado-so/search/internal/buildinfo.ReleaseKeyID={{ .Env.KADO_RELEASE_KEY_ID }}
      - -X github.com/kado-so/search/internal/buildinfo.ReleaseMetadataURL={{ .Env.KADO_RELEASE_METADATA_URL }}

archives:
  - formats: [binary]

changelog:
  disable: true

release:
  disable: true
